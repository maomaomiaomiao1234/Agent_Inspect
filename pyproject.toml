[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-trace-review"
version = "0.3.0"
description = "Evidence-backed agent evaluation with generic traces, task profiles and custom evaluators"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "typer>=0.15,<1", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
scout = ["inspect-scout==0.5.2"]
pdf-fixtures = [
    "pdfplumber>=0.11,<1",
    "reportlab>=4,<5",
]

[project.scripts]
agent-review = "agent_trace_review.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_trace_review"]
artifacts = ["src/agent_trace_review/static/**"]

[tool.hatch.build.targets.wheel.force-include]
"examples/smolagents/agent_server.py" = "agent_trace_review/repository_templates/smolagents_agent.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
