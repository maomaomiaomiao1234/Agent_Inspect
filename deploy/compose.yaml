services:
  judge:
    build:
      context: ..
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      AGENT_REVIEW_SERVICE_TOKEN: ${AGENT_REVIEW_SERVICE_TOKEN:?Set a service access token}
      AGENT_REVIEW_ALLOWED_HOSTS: ${AGENT_REVIEW_ALLOWED_HOSTS:-localhost,127.0.0.1}
    volumes:
      - review-data:/data
      - ./targets.example.json:/config/targets.json:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 1g
    pids_limit: 128
    depends_on:
      control-agent:
        condition: service_healthy
  control-agent:
    build:
      context: ../examples/assessment
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9081/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  review-data:
