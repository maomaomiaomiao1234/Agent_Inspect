[project]
name = "agent-inspect-smolagents-example"
version = "0.1.0"
description = "An isolated smolagents target for Agent Inspect active assessments"
requires-python = ">=3.12"
dependencies = [
  "smolagents[openai]==1.26.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
